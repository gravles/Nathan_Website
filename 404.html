<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found – Nathan Davie</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#060a13" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    .nf-wrap {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(91,156,246,.1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(224,179,90,.07) 0%, transparent 60%),
        var(--bg);
    }
    .nf-code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(6rem, 20vw, 11rem);
      line-height: 1;
      letter-spacing: -.03em;
      background: linear-gradient(120deg, var(--gold) 20%, #b9c8de 60%, var(--blue) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .nf-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--text);
      margin-bottom: .75rem;
    }
    .nf-text {
      color: var(--text-mut);
      font-size: 1rem;
      max-width: 420px;
      margin-bottom: 2.25rem;
    }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-code">404</div>
    <h1 class="nf-title">Page not found</h1>
    <p class="nf-text">The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <a href="/" class="btn-primary">Back to Home</a>
  </div>
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
